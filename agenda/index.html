/* ---------- iconos simples (SVG propios, sin dependencias) ---------- */

const IDownload = (p) => <Icon {...p}><path d="M12 3v12" /><polyline points="7 10 12 15 17 10" /><path d="M5 19h14" /></Icon>;

/* ---------- constantes ---------- */
const STATUS = {

const inputStyle = {

  border: "1px solid rgba(196,181,253,0.18)", borderRadius: 12, padding: "11px 13px",
  color: "#ede9fe", fontSize: 14.5, fontFamily: "'Manrope', sans-serif", outline: "none",

/* ---------- pantalla de configuración faltante ---------- */
function SetupNeeded() {
  return (
    <div style={{ minHeight: "100vh", background: "#0c0716", display: "flex", alignItems: "center", justifyContent: "center", padding: 24, color: "#ede9fe", textAlign: "center" }}>

        <h2 style={{ fontFamily: "'Fraunces', serif" }}>Falta configurar la base de datos</h2>
        <p style={{ color: "#9d8fc7", fontSize: 14, lineHeight: 1.6 }}>Abre <code>index.html</code> y reemplaza SUPABASE_URL y SUPABASE_ANON_KEY con los datos de tu proyecto de Supabase, luego vuelve a subir el archivo.</p>
      </div>
    </div>
  );
}

/* ---------- inicio de sesión (Supabase Auth real) ---------- */
function AuthGate({ onAuth }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError(""); setInfo(""); setBusy(true);
    if (mode === "signin") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      setBusy(false);
      if (error) return setError(error.message === "Invalid login credentials" ? "Correo o contraseña incorrectos." : error.message);
      onAuth();
    } else {
      const { data, error } = await sb.auth.signUp({ email, password });
      setBusy(false);
      if (error) return setError(error.message);
      if (data.session) { onAuth(); return; }
      setInfo("Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.");
      setMode("signin");
    }
  };

  return (
    <div style={{ minHeight: "100vh", background: "radial-gradient(ellipse at top, #24173f 0%, #120b1f 55%, #0c0716 100%)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ width: "100%", maxWidth: 360 }}>
        <div style={{ width: 52, height: 52, borderRadius: 16, background: "linear-gradient(135deg,#8b5cf6,#d946ef)", display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px", color: "#fff" }}><ILock size={24} /></div>
        <h1 style={{ fontFamily: "'Fraunces', serif", fontSize: 22, color: "#f5f1ff", textAlign: "center", margin: "0 0 4px", fontWeight: 600 }}>{mode === "signin" ? "Panel privado" : "Crear tu cuenta"}</h1>
        <p style={{ textAlign: "center", color: "#9d8fc7", fontSize: 13, margin: "0 0 22px" }}>{mode === "signin" ? "Inicia sesión para ver tu información, sincronizada en todos tus dispositivos." : "Solo hazlo una vez. Después desactiva los registros nuevos en Supabase."}</p>
        <input type="email" style={{ ...inputStyle, marginBottom: 10 }} placeholder="Correo" value={email} onChange={(e) => setEmail(e.target.value)} autoFocus />
        <input type="password" style={{ ...inputStyle, marginBottom: 10 }} placeholder="Contraseña" value={password} onChange={(e) => setPassword(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} />
        {error && <div style={{ color: "#fb7185", fontSize: 12.5, textAlign: "center", marginBottom: 10 }}>{error}</div>}
        {info && <div style={{ color: "#34d399", fontSize: 12.5, textAlign: "center", marginBottom: 10 }}>{info}</div>}
        <button disabled={busy || !email || !password} onClick={submit} style={{ width: "100%", padding: "13px", borderRadius: 12, border: "none", background: "linear-gradient(135deg,#8b5cf6,#d946ef)", color: "#fff", fontWeight: 700, fontSize: 15, cursor: "pointer", opacity: busy ? 0.6 : 1 }}>{mode === "signin" ? "Entrar" : "Crear cuenta"}</button>
        <button onClick={() => { setMode(mode === "signin" ? "signup" : "signin"); setError(""); setInfo(""); }} style={{ display: "block", margin: "16px auto 0", background: "none", border: "none", color: "#a78bfa", fontSize: 12.5, cursor: "pointer" }}>{mode === "signin" ? "¿Primera vez? Crea tu cuenta" : "Ya tengo cuenta, iniciar sesión"}</button>
      </div>
    </div>
  );
}

/* ---------- piezas reutilizables ---------- */
function Modal({ title, onClose, children }) {
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(10,6,20,0.7)", backdropFilter: "blur(4px)", display: "flex", alignItems: "flex-end", justifyContent: "center", zIndex: 50 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ width: "100%", maxWidth: 480, maxHeight: "88vh", overflowY: "auto", background: "linear-gradient(180deg, #1c1330 0%, #150e24 100%)", border: "1px solid rgba(196,181,253,0.15)", borderTop: "1px solid rgba(196,181,253,0.25)", borderRadius: "24px 24px 0 0", padding: "20px 20px 28px", boxShadow: "0 -8px 40px rgba(0,0,0,0.5)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
          <h3 style={{ fontFamily: "'Fraunces', serif", fontSize: 20, color: "#ede9fe", margin: 0, fontWeight: 600 }}>{title}</h3>
          <button onClick={onClose} style={{ background: "rgba(255,255,255,0.06)", border: "none", borderRadius: 999, width: 32, height: 32, display: "flex", alignItems: "center", justifyContent: "center", color: "#c4b5fd", cursor: "pointer" }}><IX size={16} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}
function Field({ label, children }) {
  return <div style={{ marginBottom: 14 }}><label style={{ display: "block", fontSize: 12, color: "#a78bfa", marginBottom: 6, letterSpacing: 0.3 }}>{label}</label>{children}</div>;
}
function StatusPicker({ value, onChange }) {
  return (
    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
      {Object.entries(STATUS).map(([key, s]) => (
        <button key={key} onClick={() => onChange(key)} style={{ padding: "8px 13px", borderRadius: 999, fontSize: 13, fontWeight: 600, border: value === key ? `1.5px solid ${s.color}` : "1.5px solid rgba(255,255,255,0.1)", background: value === key ? s.bg : "rgba(255,255,255,0.03)", color: value === key ? s.color : "#9d8fc7", cursor: "pointer" }}>{s.label}</button>
      ))}
    </div>
  );
}

/* ---------- formularios ---------- */

      <Field label="Correo"><input style={inputStyle} value={email} onChange={(e) => setEmail(e.target.value)} placeholder="correo@ejemplo.com" /></Field>
      <Field label="Teléfono"><input style={inputStyle} value={telefono} onChange={(e) => setTelefono(e.target.value)} placeholder="+504" /></Field>
      <button disabled={!nombre.trim()} onClick={() => { onSave({ id: initial?.id || uid(), nombre: nombre.trim(), empresa: empresa.trim(), email: email.trim(), telefono: telefono.trim(), colaboradores: initial?.colaboradores || [] }); onClose(); }} style={{ width: "100%", marginTop: 6, padding: "13px", borderRadius: 12, border: "none", background: nombre.trim() ? "linear-gradient(135deg,#8b5cf6,#d946ef)" : "rgba(255,255,255,0.08)", color: "#fff", fontWeight: 700, fontSize: 15, cursor: nombre.trim() ? "pointer" : "not-allowed" }}>Guardar cliente</button>

/* ---------- tarjetas ---------- */
function ProjectCard({ project, clientName, onEdit, onDelete }) {
  const s = STATUS[project.status];
  const dias = Math.ceil((new Date(project.fechaEntrega) - new Date(new Date().toDateString())) / 86400000);
  return (
    <div style={{ background: "rgba(255,255,255,0.04)", border: `1px solid ${s.ring}`, borderRadius: 16, padding: 14, marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
        <div><div style={{ fontSize: 15, fontWeight: 700, color: "#ede9fe" }}>{project.nombre}</div>{clientName && <div style={{ fontSize: 12.5, color: "#9d8fc7", marginTop: 2 }}>{clientName}</div>}</div>
        <span style={{ fontSize: 11.5, fontWeight: 700, color: s.color, background: s.bg, padding: "4px 10px", borderRadius: 999, whiteSpace: "nowrap" }}>{s.label}</span>
      </div>
      {project.descripcion && <div style={{ fontSize: 13, color: "#c4b5fd", marginTop: 8, lineHeight: 1.4 }}>{project.descripcion}</div>}
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 10 }}>

/* ---------- ajustes / respaldo ---------- */
function SettingsSheet({ data, onImport, onClose, onLogout, syncState }) {
  const fileRef = useRef(null);
  const [msg, setMsg] = useState("");

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `respaldo-estudio-${new Date().toISOString().slice(0, 10)}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  const handleFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (!parsed.clients || !parsed.projects) throw new Error();
        onImport({ clients: parsed.clients || [], projects: parsed.projects || [], tasks: parsed.tasks || [] });
        setMsg("Respaldo importado y sincronizado.");
      } catch { setMsg("Ese archivo no es un respaldo válido."); }
    };
    reader.readAsText(file);
  };

  return (
    <Modal title="Ajustes y respaldo" onClose={onClose}>
      <div style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 12.5, color: syncState === "error" ? "#fb7185" : "#34d399", marginBottom: 16 }}>
        <ICloud size={14} /> {syncState === "error" ? "Sin conexión — no se pudo sincronizar" : "Sincronizado con la nube"}
      </div>
      <p style={{ fontSize: 13, color: "#9d8fc7", lineHeight: 1.5, marginTop: 0 }}>Tus datos ya se sincronizan solos entre tu celular y tu computadora al iniciar sesión con la misma cuenta. Estos botones son solo para respaldos manuales.</p>
      <button onClick={exportBackup} style={{ width: "100%", padding: "12px", borderRadius: 12, border: "1px solid rgba(196,181,253,0.25)", background: "rgba(255,255,255,0.04)", color: "#ede9fe", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 10 }}><IDownload size={16} /> Exportar respaldo (.json)</button>
      <button onClick={() => fileRef.current.click()} style={{ width: "100%", padding: "12px", borderRadius: 12, border: "1px solid rgba(196,181,253,0.25)", background: "rgba(255,255,255,0.04)", color: "#ede9fe", fontWeight: 700, fontSize: 14, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 6 }}><IUpload size={16} /> Importar respaldo</button>
      <input ref={fileRef} type="file" accept="application/json" onChange={handleFile} style={{ display: "none" }} />
      {msg && <div style={{ fontSize: 12.5, color: "#a78bfa", marginTop: 8 }}>{msg}</div>}
      <div style={{ height: 1, background: "rgba(196,181,253,0.12)", margin: "18px 0" }} />
      <button onClick={onLogout} style={{ width: "100%", padding: "12px", borderRadius: 12, border: "none", background: "rgba(251,113,133,0.1)", color: "#fb7185", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>Cerrar sesión</button>
    </Modal>
  );
}

/* ---------- datos en la nube ---------- */
function useCloudData(userId) {
  const [state, setState] = useState(EMPTY_DATA);
  const [loaded, setLoaded] = useState(false);
  const [syncState, setSyncState] = useState("ok");

  const fetchRemote = useCallback(async () => {
    const { data, error } = await sb.from("estudio_data").select("data").eq("user_id", userId).maybeSingle();
    if (error) { setSyncState("error"); return; }
    if (data?.data) {
      setState(data.data);
      localStorage.setItem(CACHE_KEY, JSON.stringify(data.data));
      setSyncState("ok");
    } else {
      await sb.from("estudio_data").insert({ user_id: userId, data: EMPTY_DATA });
    }
  }, [userId]);

  useEffect(() => {
    (async () => {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) { try { setState(JSON.parse(cached)); } catch {} }
      await fetchRemote();
      setLoaded(true);
    })();
    const onVisible = () => { if (document.visibilityState === "visible") fetchRemote(); };
    document.addEventListener("visibilitychange", onVisible);
    return () => document.removeEventListener("visibilitychange", onVisible);
  }, [fetchRemote]);

  const persist = useCallback(async (next) => {
    setState(next);
    localStorage.setItem(CACHE_KEY, JSON.stringify(next));
    const { error } = await sb.from("estudio_data").upsert({ user_id: userId, data: next, updated_at: new Date().toISOString() });
    setSyncState(error ? "error" : "ok");
  }, [userId]);

  return { ...state, persist, loaded, syncState };
}

  const saveClients = (next) => { setClients(next); persist({ clients: next, projects, tasks }); };

        <div style={{ padding: "6px 18px" }}>
          {tasks.length === 0 ? (<div style={{ textAlign: "center", padding: "50px 20px", color: "#6b5f92", fontSize: 13.5 }}>Aquí van tus cosas del estudio que no son de un cliente: cursos, certificados, pendientes personales. Agrega la primera.</div>) : (
            tasks.slice().sort((a, b) => (a.fecha || "9999").localeCompare(b.fecha || "9999")).map((t) => (<TaskCard key={t.id} task={t} onEdit={() => { setEditTask(t); setShowTaskForm(true); }} onDelete={() => deleteTask(t.id)} />))
          )}
        </div>
      )}

      {tab === "clients" && !selectedClient && (<button onClick={() => { setEditClient(null); setShowClientForm(true); }} style={{ position: "fixed", bottom: 84, right: 20, width: 52, height: 52, borderRadius: "50%", background: "linear-gradient(135deg,#8b5cf6,#d946ef)", border: "none", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 6px 24px rgba(139,92,246,0.5)", cursor: "pointer", zIndex: 10 }}><IPlus size={24} /></button>)}
      {tab === "tasks" && (<button onClick={() => { setEditTask(null); setShowTaskForm(true); }} style={{ position: "fixed", bottom: 84, right: 20, width: 52, height: 52, borderRadius: "50%", background: "linear-gradient(135deg,#8b5cf6,#d946ef)", border: "none", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 6px 24px rgba(139,92,246,0.5)", cursor: "pointer", zIndex: 10 }}><IPlus size={24} /></button>)}

      <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "rgba(18,11,31,0.92)", backdropFilter: "blur(12px)", borderTop: "1px solid rgba(196,181,253,0.15)", display: "flex", padding: "10px 0 18px" }}>
        {[{ key: "dashboard", label: "Panorama", icon: ICalendar }, { key: "clients", label: "Clientes", icon: IUsers }, { key: "tasks", label: "Estudio", icon: IGrad }].map(({ key, label, icon: Ic }) => (
          <button key={key} onClick={() => { setTab(key); setSelectedClient(null); }} style={{ flex: 1, background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, color: tab === key ? "#c4b5fd" : "#6b5f92", cursor: "pointer" }}><Ic size={19} /><span style={{ fontSize: 11, fontWeight: 600 }}>{label}</span></button>
        ))}
      </div>

      {showClientForm && <ClientForm initial={editClient} onClose={() => setShowClientForm(false)} onSave={(c) => { const exists = clients.some((x) => x.id === c.id); const next = exists ? clients.map((x) => x.id === c.id ? c : x) : [...clients, c]; saveClients(next); if (selectedClient?.id === c.id) setSelectedClient(c); }} />}
      {showCollabForm && selectedClient && <CollaboratorForm onClose={() => setShowCollabForm(false)} onSave={(col) => { const updated = { ...selectedClient, colaboradores: [...selectedClient.colaboradores, col] }; const nc = clients.map((c) => c.id === selectedClient.id ? updated : c); saveClients(nc); setSelectedClient(updated); }} />}
      {showProjectForm && <ProjectForm clientId={projectForClient} initial={editProject} onClose={() => { setShowProjectForm(false); setEditProject(null); }} onSave={(p) => { const exists = projects.some((x) => x.id === p.id); saveProjects(exists ? projects.map((x) => x.id === p.id ? p : x) : [...projects, p]); }} />}
      {showTaskForm && <TaskForm initial={editTask} onClose={() => { setShowTaskForm(false); setEditTask(null); }} onSave={(t) => { const exists = tasks.some((x) => x.id === t.id); saveTasks(exists ? tasks.map((x) => x.id === t.id ? t : x) : [...tasks, t]); }} />}
      {showSettings && <SettingsSheet data={{ clients, projects, tasks }} syncState={syncState} onClose={() => setShowSettings(false)} onImport={(d) => { setClients(d.clients); setProjects(d.projects); setTasks(d.tasks); persist(d); }} onLogout={onLogout} />}
    </div>
  );
}

/* ---------- raíz: sesión de Supabase + app ---------- */
function Root() {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) return <div style={{ minHeight: "100vh", background: "#150e24" }} />;
  if (!session) return <AuthGate onAuth={() => {}} />;
  return <App userId={session.user.id} onLogout={() => sb.auth.signOut()} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(sb ? <Root /> : <SetupNeeded />);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
</body>
